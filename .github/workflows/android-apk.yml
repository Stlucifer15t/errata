name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'mobile/**'
      - 'package.json'
      - 'patches/**'
      - 'scripts/build-android.mjs'
      - 'src/**'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android build tools
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript dependencies
        run: bun install

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          bun run android:apk 2>&1 | tee /tmp/android-build.log
          build_status=${PIPESTATUS[0]}
          set -e

          if (( build_status != 0 )); then
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              line="${line//%/%25}"
              line="${line//$'\r'/%0D}"
              printf '::error title=Android APK build log::%s\n' "${line:0:1000}"
            done < <(tail -n 8 /tmp/android-build.log | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g')
          fi
          exit "$build_status"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: errata-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
